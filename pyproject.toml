[project]
name = "minds14-intent-service"
version = "0.1.0"
description = "MINDS-14 intent classification with text and audio FastAPI service"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=0.30.0",
    "datasets>=2.19.0",
    "evaluate>=0.4.2",
    "fastapi>=0.111.0",
    "jiwer>=3.0.4",
    "joblib>=1.4.0",
    "loguru>=0.7.2",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "peft>=0.11.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.4.0",
    "scipy>=1.11.0",
    "soundfile>=0.12.1",
    "torch>=2.2.0",
    "transformers>=4.41.0",
    "uvicorn[standard]>=0.29.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
